<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img/logo.png">
    <link rel="stylesheet" href="css/template.css">
    <link rel="stylesheet" href="css/order.css">
    <script src="js/order.js"></script>
    <title>Заказ</title>
</head>
<body>
    <header>
        <div>
            <section>
                <p><span><b>АКИБ</b></span> <span>Аутсорсинг</span> <span>IT</span> <span>Безопасность</span></p>
            </section>

            <section>
                <nav>
                    <a href="./index.html">Главная</a>
                    <div id="cart-icon" onclick="toggleCart()">
                        🛒 Корзина (<span id="cart-count">0</span>)
                    </div>
                </nav>
            </section>
        </div>
    </header>
    <main>
        <!-- Все секции будут заполняться динамически через JavaScript -->
    </main>
    
    <footer>
        <div>
            <section>+7 (999) 999 99-99</section>
            <section>© Все права защищены студентом Московского Политеха А.А. 2025</section>
            <section>г.Москва, улица Автозаводская, 16с5</section>
        </div>
    </footer>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeOrderForm()">&times;</span>
            <h2>Заказ услуги</h2>
            
            <div class="service-info">
                <p><strong>Услуга:</strong> <span id="selectedService"></span></p>
                <p><strong>Стоимость:</strong> <span id="selectedPrice"></span></p>
            </div>

            <form id="orderForm" action="https://httpbin.org/post" method="POST" accept-charset="utf-8">
                <div class="form-group">
                    <label for="company">Компания *</label>
                    <input type="text" id="company" name="company" required>
                </div>

                <div class="form-group">
                    <label for="name">Контактное лицо *</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="phone">Телефон *</label>
                    <input type="tel" id="phone" name="phone" required>
                </div>

                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="description">Описание задачи</label>
                    <textarea id="description" name="description" placeholder="Опишите кратко ваши потребности..."></textarea>
                </div>

                <div class="form-group">
                    <label for="employees">Количество сотрудников</label>
                    <select id="employees" name="employees">
                        <option value="">Выберите количество</option>
                        <option value="1-10">1-10</option>
                        <option value="11-50">11-50</option>
                        <option value="51-200">51-200</option>
                        <option value="201-500">201-500</option>
                        <option value="500+">500+</option>
                    </select>
                </div>

                <button type="submit" class="submit-btn">Отправить заявку</button>
            </form>
        </div>
    </div>

    <div id="cartModal" class="modal">
        <div class="cart-modal-content">
            <span class="close" onclick="closeCart()">&times;</span>
            <h2>Корзина услуг</h2>
            
            <div id="cartItems">
                <!-- Содержимое корзины будет здесь -->
            </div>
            
            <div class="cart-total">
                Итого: ≈<span id="cartTotal">0 ₽</span>
            </div>
            
            <div class="cart-actions">
                <button id="closeCart" onclick="closeCart()">Продолжить выбор</button>
                <button id="checkoutBtn" onclick="checkoutFromCart()">Перейти к оформлению</button>
            </div>
        </div>
    </div>
</body>
</html>
